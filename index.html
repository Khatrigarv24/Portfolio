<!doctype html>
<html lang="en" id="top">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Garv Khatri | Web Developer & UI/UX Designer</title>
    <meta name="description" content="Minimalist portfolio showcasing web development projects and skills">
    <style>
      :root {
        --oxford-blue: #14213D;
        --beige: #b19079;
        --cream: #efebe0;
      }
      
      body {
        margin: 0;
        padding: 0;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        background-color: var(--cream);
        color: var(--oxford-blue);
        overflow-x: hidden;
      }

      /* Scrollbar customization */
      ::-webkit-scrollbar {
        width: 8px;
      }

      ::-webkit-scrollbar-track {
        background: var(--cream);
      }

      ::-webkit-scrollbar-thumb {
        background: var(--beige);
        border-radius: 4px;
      }

      ::-webkit-scrollbar-thumb:hover {
        background: var(--oxford-blue);
      }
      
      /* Animations */
      @keyframes fadeIn {
        from { opacity: 0; }
        to { opacity: 1; }
      }
      
      @keyframes slideUp {
        from { transform: translateY(20px); opacity: 0; }
        to { transform: translateY(0); opacity: 1; }
      }
      
      @keyframes slideRight {
        from { transform: translateX(-20px); opacity: 0; }
        to { transform: translateX(0); opacity: 1; }
      }
      
      @keyframes slideLeft {
        from { transform: translateX(20px); opacity: 0; }
        to { transform: translateX(0); opacity: 1; }
      }
      
      @keyframes bounce {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-10px); }
      }
      
      @keyframes pulse {
        0% { transform: scale(1); }
        50% { transform: scale(1.05); }
        100% { transform: scale(1); }
      }
      
      /* Initial page load animation */
      #root {
        animation: fadeIn 0.8s ease-out forwards;
      }
      
      /* Smooth scrolling for the entire page */
      html {
        scroll-behavior: smooth;
        scroll-padding-top: 80px; /* Adjust based on your header height */
      }
      
      /* Page preloader */
      .preloader {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background-color: var(--cream);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        transition: opacity 0.5s, visibility 0.5s;
      }

      .preloader.fade-out {
        opacity: 0;
        visibility: hidden;
      }
      
      .loader {
        width: 40px;
        height: 40px;
        border: 4px solid rgba(177, 144, 121, 0.3);
        border-top-color: var(--beige);
        border-radius: 50%;
        animation: spin 1s ease-in-out infinite;
      }
      
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
      
      /* Custom class for cursor */
      .cursor-blink {
        display: inline-block;
        width: 2px;
        height: 1em;
        background-color: var(--beige);
        animation: blink 0.7s infinite;
      }
      
      @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
      
      /* Custom animations that can be applied to elements */
      .anim-fade-in {
        animation: fadeIn 1s ease forwards;
      }
      
      .anim-slide-up {
        animation: slideUp 0.8s ease-out forwards;
      }
      
      .anim-slide-right {
        animation: slideRight 0.8s ease-out forwards;
      }
      
      .anim-slide-left {
        animation: slideLeft 0.8s ease-out forwards;
      }
      
      .anim-bounce {
        animation: bounce 2s infinite ease-in-out;
      }
      
      .anim-pulse {
        animation: pulse 2s infinite ease-in-out;
      }
      
      /* Animation delays */
      .delay-100 { animation-delay: 100ms; }
      .delay-200 { animation-delay: 200ms; }
      .delay-300 { animation-delay: 300ms; }
      .delay-400 { animation-delay: 400ms; }
      .delay-500 { animation-delay: 500ms; }
    </style>
  </head>
  <body>
    <!-- Preloader -->
    <div class="preloader">
      <div class="loader"></div>
    </div>

    <div id="root"></div>
    
    <script>
      // Handle preloader
      window.addEventListener('load', function() {
        setTimeout(function() {
          document.querySelector('.preloader').classList.add('fade-out');
        }, 500);
        
        // Ensure we start at the top of the page
        setTimeout(function() {
          window.scrollTo(0, 0);
        }, 100);
      });
      
      // Fix for iOS devices to reset scroll position
      if ('scrollRestoration' in history) {
        history.scrollRestoration = 'manual';
      }
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
